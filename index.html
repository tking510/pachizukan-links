<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: #0d1117;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  /* Hero */
  .hero {
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .hero-img {
    width: 100%;
    display: block;
  }

  /* Bio */
  .profile {
    text-align: center;
    margin-bottom: 28px;
  }
  .bio {
    font-size: 14px;
    color: #c9d1d9;
    max-width: 320px;
    line-height: 1.6;
  }

  /* Link Cards with Banner Images */
  .links {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-card {
    display: block;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    position: relative;
  }
  .link-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .link-card:active {
    transform: translateY(0);
  }

  /* Card with banner image */
  .link-card .card-banner {
    width: 100%;
    display: block;
    height: auto;
  }

  /* Card without banner (fallback) */
  .link-card-text {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .link-card-text:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .link-card-text .icon {
    font-size: 28px;
    flex-shrink: 0;
  }
  .link-card-text .info {
    display: flex;
    flex-direction: column;
  }
  .link-card-text .subtitle {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }
  .pachi-db {
    background: linear-gradient(135deg, #FFD700 0%, #b8960f 100%);
    color: #1a1a2e;
  }
  .pachi-db .subtitle { color: #333; }

  /* Badge */
  .badge-new {
    position: absolute;
    top: 45px;
    left: 12px;
    background: #ff4444;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 12px;
    z-index: 2;
    animation: pulse 2s infinite;
    box-shadow: 0 2px 8px rgba(255,68,68,0.6);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.05); }
  }

  /* Shimmer effect for featured card */
  .link-card-featured {
    position: relative;
    overflow: hidden;
  }
  .link-card-featured::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,215,0,0.15) 40%,
      rgba(255,255,255,0.25) 50%,
      rgba(255,215,0,0.15) 60%,
      transparent 100%
    );
    animation: shimmer 3s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    text-align: center;
    color: #484f58;
    font-size: 12px;
  }
</style>
</head>

</div>

</div>

  <p>© 2026 パチンコ情報局</p>

</body>
</html>
