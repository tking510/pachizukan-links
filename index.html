    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255,215,0,0.15) 40%, rgba(255,255,255,0.25) 50%, rgba(255,215,0,0.15) 60%, transparent 100%);

    z-index: 1;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }
