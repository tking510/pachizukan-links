<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: #0d1117;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .hero {
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .hero-img {
    width: 100%;
    display: block;
  }
  .profile {
    text-align: center;
    margin-bottom: 32px;
  }
  .bio {
    font-size: 14px;
    color: #c9d1d9;
    max-width: 320px;
    line-height: 1.6;
  }
  .links {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }
  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .link-card:active {
    transform: translateY(0);
  }
  .link-card .icon {
    font-size: 28px;
    flex-shrink: 0;
  }
  .link-card .info {
    display: flex;
    flex-direction: column;
  }
  .link-card .subtitle {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }

  /* Telegram Channel - Blue */
  .tg-channel {
    background: linear-gradient(135deg, #0088cc 0%, #005f8f 100%);
  }
  /* Telegram Community - Orange/Warm */
  .tg-community {
    background: linear-gradient(135deg, #FF6B35 0%, #cc4400 100%);
  }
  /* パチ図鑑 DB - Gold */
  .pachi-db {
    background: linear-gradient(135deg, #FFD700 0%, #b8960f 100%);
    color: #1a1a2e;
  }
  .pachi-db .subtitle {
    color: #333;
  }
  /* X (Twitter) */
  .x-link {
    background: linear-gradient(135deg, #1d9bf0 0%, #0d8bd9 100%);
  }

  .footer {
    margin-top: 40px;
    text-align: center;
    color: #484f58;
    font-size: 12px;
  }
  .footer a {
    color: #58a6ff;
    text-decoration: none;
  }

  /* Pulse animation for new badge */
  .badge-new {
    background: #ff4444;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
